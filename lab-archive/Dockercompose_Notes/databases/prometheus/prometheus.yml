global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

# Add hosts you want to monitor to this section 
# Run *docker compose restart prometheus command
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
      - targets: ["172.26.9.159:9100"]

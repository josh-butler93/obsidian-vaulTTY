:root{--bg:#060612;--line:#2b2750;--text:#dedaf0;--muted:#8a849f;--violet:#9a7cff;--cyan:#55e6d1;--pink:#fb82bb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 83% 0,#272052 0,transparent 29%),radial-gradient(circle at 0 95%,#08323a 0,transparent 30%),var(--bg);color:var(--text);font-family:Manrope,Arial,sans-serif;min-height:100vh}.app{display:grid;grid-template-columns:245px minmax(0,315px) minmax(0,1fr);min-height:100vh}.app:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:4;background:linear-gradient(115deg,transparent 35%,#9c84ff08 45%,transparent 52%);background-size:220% 100%;animation:sweep 12s linear infinite}.app:after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.28;background-image:linear-gradient(#bdb3ff0b 1px,transparent 1px),linear-gradient(90deg,#bdb3ff0b 1px,transparent 1px);background-size:46px 46px;mask-image:linear-gradient(black,transparent 80%)}@keyframes sweep{to{background-position:-220% 0}}.sidebar,.notes{border-right:1px solid var(--line);z-index:1}.sidebar{padding:28px 14px;display:flex;flex-direction:column;background:#080817bb;backdrop-filter:blur(18px)}.brand{padding:0 10px 32px;font:700 19px 'DM Mono';letter-spacing:2px;color:#f5f2ff}.brand b{color:var(--violet);text-shadow:0 0 18px var(--violet);margin-right:8px}.new,.empty button{border:1px solid #b397ff88;border-radius:10px;background:linear-gradient(115deg,#755cda,#a980ff);color:white;padding:11px 12px;font-weight:800;box-shadow:0 9px 25px #6647c544;transition:.2s}.new:hover,.empty button:hover{transform:translateY(-2px);box-shadow:0 14px 31px #8869fa77}.new{width:100%;text-align:left}.new span{font-size:18px;margin-right:6px}.label{font:10px 'DM Mono';color:var(--muted);letter-spacing:1.3px;text-transform:uppercase;margin:31px 10px 8px}.folder{border:0;background:transparent;color:#a7a1b6;border-radius:8px;padding:10px;width:100%;display:flex;align-items:center;gap:9px;text-align:left;font:600 13px Manrope}.folder:hov 10px;padding:12px 13px;background:transparent;text-align:left;color:#aaa4ba;transition:.18s}.note:hover{background:#17152a;border-color:#8270db22;transform:translateX(2px)}.note.active{background:linear-gradient(110deg,#745bd047,#33285844);border-color:#9f8aff55;box-shadow:0 8px 26px #120c3344}.note b{display:block;color:#e8e4f4;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note p{margin:5px 26px 7px 0;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note time{color:var(--muted);font:9px 'DM Mono'}.editor{z-index:1;padding:29px 8%;display:flex;flex-direction:column;min-width:0}.editor-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font:10px 'DM Mono'}.sync{color:var(--cyan)}.sync i{display:inline-block;width:6px;height:6px;background:var(--cyan);border-radius:50%;box-shadow:0 0 9px var(--cyan);margin-right:6px}.editor-top select,.editor-top button{background:#151323;color:#bcb4d2;border:1px solid #383253;border-radius:7px;padding:7px;font-size:10px}.editor-top button{color:#b18da6;font-size:12px}.editor-top button:hover,.editor-top button.on{color:#fff;background:#8066e5;border-color:#a48cff}.editor-top .trash:hover{color:var(--pink);background:#351021;border-color:#fb82bb66}.title{border:0;outline:0;background:transparent;color:#f7f4ff;font:700 35px Manrope;letter-spacing:-1.8px;margin:54px 0 22px;width:100%}.terminal{flex:1;display:flex;flex-direction:column;min-height:430px;border:1px solid #3b315d;background:linear-gradient(145deg,#0c0a1a,#060611);box-shadow:inset 0 0 30px #120d2e88,0 0 25px #7d63dc12}.terminal-bar{padding:8px 11px;display:flex;justify-content:space-between;background:#151127;border-bottom:1px solid #393054;color:#9f94be;font:9px 'DM Mono';letter-spacing:.8px}.terminal-bar:before{content:'● ● ●';color:#9d81ed;letter-spacing:3px}.body,.markdown{border:0;outline:0;resize:none;background:transparent;color:#c6c0d6;font:14px/1.8 'DM Mono';min-height:0;flex:1;wi <script src="fold.js?v=9835352"></script><script>
const KEY='nebula-vanilla-v1',uid=()=>crypto.randomUUID?.()||Math.random().toString(36).slice(2),sample={folders:[{id:'inbox',name:'All notes',color:'#9a7cff'},{id:'ideas',name:'Ideas',color:'#55e6d1'},{id:'personal',name:'Personal',color:'#fb82bb'}],notes:[{id:'welcome',title:'Welcome to Nebula',body:'# Welcome to Nebula\n\nA calm place for your thoughts.\n\nUse **Markdown** for _rich_ notes, `code`, lists, links, and headings.',folderId:'inbox',updatedAt:new Date().toISOString()},{id:'orbit',title:'Orbiting ideas',body:'## Orbiting ideas\n\n- Build small things\n- Keep what matters close\n- Make space to think',folderId:'ideas',updatedAt:new Date(Date.now()-864e5).toISOString()}]};let data;try{data=JSON.parse(localStorage.getItem(KEY))||sample}catch{data=sample}let folder='inbox',selected='welcome',search='',preview=false;const $=s=>document.querySelector(s),save=()=>localStorage.setItem(KEY,JSON.stringify(data)),esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const md=s=>{let h=esc(s);h=h.replace(/```([\s\S]*?)```/g,'<pre><code>$1</code></pre>').replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/^&gt; (.*)$/gm,'<blockquote>$1</blockquote>').replace(/^---$/gm,'<hr>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');h=h.replace(/(?:^- (.*)$\n?)+/gm,m=>'<ul>'+m.trim().split('\n').map(x=>'<li>'+x.slice(2)+'</li>').join('')+'</ul>');return h.split(/\n{2,}/).map(x=>/^(<h|<ul|<pre|<blockquote|<hr)/.test(x)?x:`<p>${x.replace(/\n/g,'<br>')}</p>`).join('')};const visible=()=>data.notes.filter(n=>{const haystack=`${n.title} ${n.body}`.toLowerCase();return (folder==='inbox'||n.folderId===folder)&&haystack.includes(search.toLowerCase())}).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));function render(){const notes=visible(),current=data.notes.find(n=>n.id===selected)||notes[0];if(current)selected=current.id;const ff=data.folders.find(f=>f.id===folder);$('#crumb').textContent=folder==='inbox'?'Your universe':ff.name;$('#folder-title').textContent=folder==='inbox'?'All notes':ff.name;$('#folders').innerHTML=`<button class="folder ${folder==='inbox'?'active':''}" data-folder="inbox">◈ All notes <small>${data.notes.length}</small></button>`;$('#custom-folders').innerHTML=data.folders.filter(f=>f.id!=='inbox').map(f=>`<div class="folder ${folder===f.id?'active':''}" data-folder="${f.id}"><i style="background:${f.color}"></i><span>${esc(f.name)}</span><small>${data.notes.filter(n=>n.folderId===f.id).length}</small><span class="folder-tools"><button data-edit-folder="${f.id}" title="Rename folder">✎</button><button data-delete-folder="${f.id}" title="Delete folder">×</button></span></div>`).join('');$('#count').textContent=`${notes.length} ${notes.length===1?'note':'notes'}`;$('#note-list').innerHTML=notes.length?notes.map(n=>`<button class="note ${n.id===selected?'active':''}" data-note="${n.id}"><b>${esc(n.title||'Untitled note')}</b><p>${esc(n.body||'No additional text')}</p><time>${new Date(n.updatedAt).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</time></button>`).join(''):'<div class="empty">No notes in this corner of the universe.</div>';$('#editor').innerHTML=current?`<header class="editor-top"><span class="sync"><i></i>Saved in this browser</span><div><button id="toggle-preview" class="${preview?'on':''}">${preview?'✎ Edit':'◉ Preview'}</button><select id="move">${data.folders.map(f=>`<option value="${f.id}" ${f.id===current.folderId?'selected':''}>${esc(f.name)}</option>`).join('')}</select><button class="trash" id="delete" title="Delete note">⌫</button></div></header><input class="title" id="title" value="${esc(current.title)}" placeholder="Untitled note">${preview?`<article class="markdown">${md(current.body)}</article>`:`<textarea class="body" id="body" placeholder="Start writing something luminous…">${esc(current.body)}</textarea>`}<footer><span id="words">0 words</span><span>${preview?'Markdown preview':'Saved automatically'}</span></footer>`:'<div class="empty"><b>✦</b><h2>A blank orbit awaits</h2><p>Create a note to begin collecting ideas.</p><button id="empty-new">Create note</button></div>';if(current){const update=()=>{const n=data.notes.find(n=>n.id===selected);n.title=$('#title').value;n.folderId=$('#move').value;if($('#body'))n.body=$('#body').value;n.updatedAt=new Date().toISOString();save();$('#words').textContent=`${n.body.trim()?n.body.trim().split(/\s+/).length:0} words`};$('#title').oninput=update;if($('#body'))$('#body').oninput=update;$('#move').onchange=()=>{update();render()};$('#toggle-preview').onclick=()=>{update();preview=!preview;render()};$('#delete').onclick=()=>{if(confirm(`Delete “${current.title}”?`)){data.notes=data.notes.filter(n=>n.id!==selected);selected='';save();render()}};update()}}function addNote(){const n={id:uid(),title:'Untitled note',body:'# Untitled note\n\nStart writing something luminous…',folderId:folder==='inbox'?'inbox':folder,updatedAt:new Date().toISOString()};data.notes.unshift(n);selected=n.id;preview=false;save();render();setTimeout(()=>$('#title')?.focus(),0)}$('#new-note').onclick=addNote;$('#new-note-2').onclick=addNote;$('#new-folder').onclick=()=>{const name=prompt('Folder name');if(name?.trim()){const colors=['#9a7cff','#55e6d1','#fb82bb','#ffc873'];const f={id:uid(),name:name.trim(),color:colors[data.folders.length%colors.length]};data.folders.push(f);folder=f.id;save();render()}};document.body.onclick=e=>{const edit=e.target.closest('[data-edit-folder]'),remove=e.target.closest('[data-delete-folder]');if(edit){const f=data.folders.find(x=>x.id===edit.dataset.editFolder),name=prompt('Rename folder',f.name);if(name?.trim()){f.name=name.trim();save();render()}return}if(remove){const id=remove.dataset.deleteFolder,f=data.folders.find(x=>x.id===id);if(confirm(`Delete folder “${f.name}”? Notes will move to All notes.`)){data.notes.forEach(n=>{if(n.folderId===id)n.folderId='inbox'});data.folders=data.folders.filter(x=>x.id!==id);if(folder===id)folder='inbox';save();render()}return}const f=e.target.closest('[data-folder]'),n=e.target.closest('[data-note]');if(f){folder=f.dataset.folder;preview=false;render()}if(n){selected=n.dataset.note;preview=false;render()}if(e.target.id==='empty-new')addNote()};$('#search').oninput=e=>{search=e.target.value;render()};$('#export').onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=url;a.download=`nebula-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url)};$('#import').onclick=()=>$('#file').click();$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const v=JSON.parse(r.result);if(!Array.isArray(v.notes)||!Array.isArray(v.folders))throw 0;data=v;folder='inbox';selected=data.notes[0]?.id||'';save();render()}catch{alert('That file is not a valid Nebula backup.')}};r.readAsText(f);e.target.value=''};render();
</script><script>
document.addEventListener('click',e=>{const h=e.target.closest('.markdown h1,.markdown h2,.markdown h3');if(!h)return;const level=Number(h.tagName[1]),hide=!h.classList.contains('folded');h.classList.toggle('folded',hide);let next=h.nextElementSibling;while(next&&(!/^H[1-3]$/.test(next.tagName)||Number(next.tagName[1])>level)){next.classList.toggle('folded-content',hide);next=next.nextElementSibling}});
</script><style>.body{border:1px solid #3b315d;background:linear-gradient(145deg,#0c0a1a,#060611);box-shadow:inset 0 0 30px #120d2e88,0 0 25px #7d63dc12;padding:18px;font:14px/1.8 'DM Mono';background-image:linear-gradient(#ffffff03 1px,transparent 1px),linear-gradient(145deg,#0c0a1a,#060611);background-size:100% 28px,100% 100%}.markdown{border:1px solid #3b315d;background:#0a0918;padding:18px;box-shadow:inset 0 0 30px #120d2e66}.markdown:before{content:'● ● ●  NEBULA // MARKDOWN';display:block;color:#9f94be;font:9px 'DM Mono';letter-spacing:1px;padding-bottom:12px;border-bottom:1px solid #393054;margin-bottom:18px}.markdown h1,.markdown h2,.markdown h3{transition:color .18s}.markdown h1:hover,.markdown h2:hover,.markdown h3:hover{color:var(--cyan)}</style></body></html>

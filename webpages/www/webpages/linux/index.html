<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CompTIA Linux+ Essentials</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --cyan: #00f0ff;
            --cyan-dim: #007a80;
            --cyan-glow: rgba(0, 240, 255, 0.4);
            --magenta: #ff00ff;
            --magenta-dim: #800080;
            --magenta-glow: rgba(255, 0, 255, 0.4);
            --lime: #00ff88;
            --lime-dim: #008044;
            --lime-glow: rgba(0, 255, 136, 0.4);
            --orange: #ff8800;
            --orange-dim: #804400;
            --orange-glow: rgba(255, 136, 0, 0.4);
            --purple: #aa00ff;
            --purple-dim: #550080;
            --purple-glow: rgba(170, 0, 255, 0.4);
            --blue: #0088ff;
            --blue-dim: #004480;
            --blue-glow: rgba(0, 136, 255, 0.4);
            --red: #ff3366;
            --red-dim: #801a33;
            --red-glow: rgba(255, 51, 102, 0.4);
            --primary: var(--cyan);
            --primary-dim: var(--cyan-dim);
            --primary-glow: var(--cyan-glow);
            --bg-dark: #050a0f;
            --bg-card: #0a1218;
            --bg-hover: #0f1a22;
            --text: #8899aa;
            --text-dim: #445566;
        }
        
        body {
            font-family: 'Share Tech Mono', 'Fira Code', monospace;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.02) 2px, rgba(255,255,255,0.02) 4px);
            pointer-events: none;
            z-index: 1000;
            animation: scanlines 6s linear infinite;
        }
        @keyframes scanlines { 0% { transform: translateY(0); } 100% { transform: translateY(4px); } }
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 20% 20%, rgba(0, 240, 255, 0.08) 0%, transparent 40%), radial-gradient(ellipse at 80% 80%, rgba(255, 0, 255, 0.06) 0%, transparent 40%), radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.5) 100%);
            pointer-events: none;
            z-index: 999;
        }
        
        .orb { position: fixed; border-radius: 50%; filter: blur(50px); pointer-events: none; z-index: 0; }
        .orb-1 { width: 300px; height: 300px; background: rgba(0, 240, 255, 0.12); top: 10%; left: 5%; animation: orb-float1 22s ease-in-out infinite; }
        .orb-2 { width: 250px; height: 250px; background: rgba(255, 0, 255, 0.1); top: 50%; right: 10%; animation-delay: -7s; animation: orb-float2 28s ease-in-out infinite; }
        .orb-3 { width: 200px; height: 200px; background: rgba(0, 255, 136, 0.08); bottom: 15%; left: 20%; animation-delay: -12s; animation: orb-float3 24s ease-in-out infinite; }
        @keyframes orb-float1 { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(40px,-30px) scale(1.1)} 66%{transform:translate(-20px,-50px) scale(0.9)} }
        @keyframes orb-float2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-40px,30px) scale(1.15)} }
        @keyframes orb-float3 { 0%,100%{transform:translate(0,0) scale(1)} 25%{transform:translate(60px,-20px) scale(0.85)} 75%{transform:translate(-30px,-40px) scale(1.05)} }
        
        .lightning { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 998; opacity: 0; }
        .lightning::before { content: ''; position: absolute; top: 0; left: 25%; width: 120px; height: 100%; background: linear-gradient(180deg, rgba(255,255,255,0.3) 0%, transparent 40%); clip-path: polygon(50% 0%, 56% 15%, 44% 25%, 52% 35%, 48% 45%, 55% 55%, 45% 65%, 50% 75%, 52% 85%, 50% 100%); animation: lightning 6s infinite; }
        .lightning::after { content: ''; position: absolute; top: 0; right: 30%; width: 100px; height: 100%; background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, transparent 40%); clip-path: polygon(50% 0%, 58% 12%, 42% 22%, 55% 32%, 45% 45%, 52% 55%, 48% 68%, 50% 100%); animation: lightning 8s infinite; animation-delay: 3s; transform: scaleX(-1); }
        @keyframes lightning { 0%,96%,100%{opacity:0} 97%{opacity:0.6} 98%{opacity:0.15} 99%{opacity:0.4} }
        
        .glitch { position: relative; animation: glitch 3s infinite; }
        .glitch::before, .glitch::after { content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .glitch::before { left: 2px; text-shadow: -2px 0 var(--magenta); clip: rect(44px, 450px, 56px, 0); animation: glitch-anim 5s infinite linear alternate-reverse; }
        .glitch::after { left: -2px; text-shadow: -2px 0 var(--cyan); clip: rect(44px, 450px, 56px, 0); animation: glitch-anim2 5s infinite linear alternate-reverse; }
        @keyframes glitch { 0%,90%,100%{transform:translate(0)} 92%{transform:translate(-2px,1px)} 94%{transform:translate(2px,-1px)} 96%{transform:translate(-1px,2px)} 98%{transform:translate(1px,-2px)} }
        @keyframes glitch-anim { 0%{clip:rect(30px,9999px,10px,0)} 25%{clip:rect(70px,9999px,90px,0)} 50%{clip:rect(10px,9999px,50px,0)} 75%{clip:rect(90px,9999px,30px,0)} 100%{clip:rect(50px,9999px,70px,0)} }
        @keyframes glitch-anim2 { 0%{clip:rect(50px,9999px,70px,0)} 25%{clip:rect(10px,9999px,30px,0)} 50%{clip:rect(90px,9999px,10px,0)} 75%{clip:rect(30px,9999px,50px,0)} 100%{clip:rect(70px,9999px,90px,0)} }
        @keyframes floatIn { 0%{opacity:0;transform:translateY(-30px) scale(0.95);filter:blur(10px)} 100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)} }
        @keyframes fadeInUp { 0%{opacity:0;transform:translateY(20px)} 100%{opacity:1;transform:translateY(0)} }
        
        .container { max-width: 900px; margin: 0 auto; position: relative; z-index: 1; }
        h1 { text-align: center; background: linear-gradient(90deg, var(--cyan), var(--magenta), var(--lime)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 10px; font-size: 1.8rem; filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.5)); letter-spacing: 4px; animation: floatIn 1s ease-out, glitch 8s infinite; }
        h1 .bracket { -webkit-text-fill-color: var(--text-dim); }
        h2 { color: var(--primary); font-size: 1.3rem; margin-bottom: 15px; text-shadow: 0 0 10px var(--primary-glow); }
        .subtitle { text-align: center; color: var(--text-dim); margin-bottom: 40px; font-size: 0.9rem; letter-spacing: 2px; }
        
        .menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
        .card { background: var(--bg-card); border: 1px solid var(--primary-dim); padding: 25px; cursor: pointer; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; overflow: hidden; animation: fadeInUp 0.6s ease-out backwards; }
        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(n+3) { animation-delay: 0.25s; }
        .card::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, var(--primary-glow), transparent); transition: left 0.5s; }
        .card:hover::before { left: 100%; }
        .card:hover { background: var(--bg-hover); border-color: var(--primary); box-shadow: 0 0 25px var(--primary-glow), inset 0 0 25px color-mix(in srgb, var(--primary) 10%, transparent); transform: translateY(-5px) scale(1.02); }
        .card:hover h3 { animation: glitch 0.3s ease-out; }
        .card h3 { color: var(--primary); margin-bottom: 10px; font-size: 1.1rem; text-shadow: 0 0 10px var(--primary-glow); }
        .card p { color: var(--text-dim); font-size: 0.85rem; line-height: 1.5; }
        .card .badge { display: inline-block; background: color-mix(in srgb, var(--primary) 15%, transparent); color: var(--primary); padding: 5px 12px; border: 1px solid var(--primary-dim); font-size: 0.8rem; margin-top: 15px; }
        
        .section-view { display: none; animation: floatIn 0.5s ease-out; }
        .section-back { background: transparent; color: var(--primary); border: 1px solid var(--primary); padding: 10px 20px; cursor: pointer; font-family: inherit; margin-bottom: 20px; transition: all 0.2s; }
        .section-back:hover { background: var(--primary); color: var(--bg-dark); box-shadow: 0 0 20px var(--primary-glow); }
        
        .subsection-menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .sub-card { background: var(--bg-card); border: 1px solid var(--primary-dim); padding: 15px; cursor: pointer; transition: all 0.3s; position: relative; }
        .sub-card:hover { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); transform: translateX(5px); }
        .sub-card h4 { color: var(--primary); margin-bottom: 5px; font-size: 1rem; }
        .sub-card p { color: var(--text-dim); font-size: 0.8rem; }
        
        .search-box input { width: 100%; padding: 15px; font-size: 1rem; font-family: inherit; background: var(--bg-card); border: 1px solid var(--primary-dim); color: var(--primary); margin-bottom: 20px; transition: all 0.3s; }
        .search-box input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }
        .search-box input::placeholder { color: var(--text-dim); }
        
        .cmd-grid { display: grid; gap: 12px; }
        .cmd-card { background: var(--bg-card); border: 1px solid var(--primary-dim); padding: 15px 20px; position: relative; transition: all 0.3s; animation: fadeInUp 0.4s ease-out backwards; }
        .cmd-card:hover { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); transform: translateX(5px); }
        .cmd-card::before { content: '>'; position: absolute; top: 15px; left: 10px; color: var(--primary-dim); font-size: 0.85rem; }
        .cmd-card code { display: block; background: var(--bg-dark); padding: 8px 12px 8px 22px; color: var(--primary); font-size: 0.95rem; text-shadow: 0 0 8px var(--primary-glow); margin-bottom: 8px; }
        .cmd-card .desc { color: var(--text); font-size: 0.85rem; margin-left: 10px; }
        
        .progress { text-align: center; color: var(--text-dim); margin-bottom: 30px; font-size: 0.9rem; }
        .question { font-size: 1.1rem; margin-bottom: 25px; line-height: 1.6; }
        input[type="text"] { width: 100%; padding: 15px; font-size: 1rem; font-family: inherit; background: var(--bg-card); border: 1px solid var(--primary-dim); color: var(--primary); margin-bottom: 15px; transition: all 0.3s; }
        input[type="text"]:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }
        input[type="text"]::placeholder { color: var(--text-dim); }
        .btn { width: 100%; padding: 15px; font-size: 1rem; font-family: inherit; background: transparent; border: 1px solid var(--primary); color: var(--primary); cursor: pointer; font-weight: 600; transition: all 0.2s; }
        .btn:hover { background: var(--primary); color: var(--bg-dark); box-shadow: 0 0 20px var(--primary-glow); }
        .result { padding: 15px; margin-top: 15px; text-align: center; display: none; }
        .correct { background: rgba(0,200,150,0.15); color: #66ffbb; border: 1px solid #00aa70; }
        .incorrect { background: rgba(255,50,80,0.15); color: #ff6688; border: 1px solid #aa3050; }
        .hint-box { background: var(--bg-card); padding: 15px; border: 1px solid var(--primary-dim); margin-bottom: 20px; color: var(--primary); font-size: 0.85rem; }
        .hint-box::before { content: '// HINT: '; color: var(--text-dim); }
        
        .score-display { text-align: center; }
        .score-display h2 { color: var(--primary); margin-bottom: 20px; }
        .score-display p { margin: 10px 0; font-size: 1.1rem; }
        .final-score { font-size: 2rem; color: var(--primary); font-weight: bold; text-shadow: 0 0 20px var(--primary-glow); }
        
        .status-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 0.75rem; color: var(--text-dim); background: var(--bg-card); padding: 8px 20px; border: 1px solid var(--primary-dim); z-index: 100; }
        .status-bar span { color: var(--primary); }
        
        .section-0 { --primary: var(--cyan); --primary-dim: var(--cyan-dim); --primary-glow: var(--cyan-glow); }
        .section-1 { --primary: var(--magenta); --primary-dim: var(--magenta-dim); --primary-glow: var(--magenta-glow); }
        .section-2 { --primary: var(--lime); --primary-dim: var(--lime-dim); --primary-glow: var(--lime-glow); }
        .section-3 { --primary: var(--orange); --primary-dim: var(--orange-dim); --primary-glow: var(--orange-glow); }
        .section-4 { --primary: var(--purple); --primary-dim: var(--purple-dim); --primary-glow: var(--purple-glow); }
        .section-5 { --primary: var(--blue); --primary-dim: var(--blue-dim); --primary-glow: var(--blue-glow); }
        
        ::selection { background: var(--primary); color: var(--bg-dark); }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="lightning"></div>
    <div class="container">
        <div id="main-menu">
            <h1 class="glitch" data-text="LINUX+ ESSENTIALS">LINUX<span class="bracket">[</span>+<span class="bracket">]</span> ESSENTIALS</h1>
            <p class="subtitle">Choose a section</p>
            <div class="menu">
                <div class="card" onclick="showApp('quiz')">
                    <h3 class="glitch" data-text="Practice Exams">▶ Practice Exams</h3>
                    <p>Interactive quizzes covering all Linux+ objectives</p>
                    <span class="badge">7 Sections</span>
                </div>
                <div class="card" onclick="showApp('commands')">
                    <h3 class="glitch" data-text="Command Reference">▶ Command Reference</h3>
                    <p>Complete command reference by section</p>
                    <span class="badge">7 Sections</span>
                </div>
            </div>
        </div>
        
        <div id="quiz-menu" class="section-view">
            <button class="section-back" onclick="showMain()">← Back to Menu</button>
            <h2>Select a Quiz Section</h2>
            <div class="menu" id="quiz-sections"></div>
        </div>
        
        <div id="quiz-view" class="section-view">
            <button class="section-back" onclick="showQuizMenu()">← Back to Sections</button>
            <div class="progress" id="progress">Question 1 of 25</div>
            <div class="hint-box" id="hint"></div>
            <div class="question" id="question"></div>
            <input type="text" id="answer" placeholder="Type your answer..." autocomplete="off">
            <button class="btn" id="submit">Submit Answer</button>
            <div class="result" id="result"></div>
        </div>
        
        <div id="quiz-score" class="section-view score-display">
            <button class="section-back" onclick="showQuizMenu()">← Back to Sections</button>
            <div id="scoreContent"></div>
        </div>
        
        <div id="commands-menu" class="section-view">
            <button class="section-back" onclick="showMain()">← Back to Menu</button>
            <h2>Select a Command Section</h2>
            <div class="menu" id="command-sections"></div>
        </div>
        
        <div id="commands-detail" class="section-view">
            <button class="section-back" onclick="showCommandsMenu()">← Back to Sections</button>
            <h2 id="detailTitle"></h2>
            <div class="search-box">
                <input type="text" id="cmdSearch" placeholder="Search commands...">
            </div>
            <div class="cmd-grid" id="commandsList"></div>
        </div>
    </div>
    <div class="status-bar">
        <span>LINUX+::</span> SYSTEM <span>|</span> ONLINE <span>|</span> <span id="clock">00:00:00</span>
    </div>

    <script>
        const quizzes = {
            filesystem: {
                title: "Filesystems & Directories",
                desc: "File system structure, permissions, ACLs, mounting, and disk management",
                questions: [
                    { q: "What directory contains system configuration files?", a: ["/etc"], hint: "Starts with /e" },
                    { q: "What command changes file permissions in numeric format?", a: ["chmod"], hint: "change mode" },
                    { q: "What command changes file ownership?", a: ["chown"], hint: "change owner" },
                    { q: "What directory contains device files?", a: ["/dev"], hint: "device" },
                    { q: "What directory contains variable data (logs, etc)?", a: ["/var"], hint: "variable" },
                    { q: "What command creates a symbolic link?", a: ["ln -s"], hint: "link symbolic" },
                    { q: "What command checks and repairs the filesystem?", a: ["fsck", "e2fsck", "xfs_repair"], hint: "file system check" },
                    { q: "What command shows disk usage by directory?", a: ["du", "du -h"], hint: "disk usage" },
                    { q: "What is the standard filesystem for RHEL/CentOS?", a: ["xfs"], hint: "Silicon Graphics" },
                    { q: "What mount option makes files executable?", a: ["exec", "noexec"], hint: "execute" },
                    { q: "What command mounts all filesystems in /etc/fstab?", a: ["mount -a"], hint: "mount all" },
                    { q: "What file contains filesystem table definitions?", a: ["/etc/fstab"], hint: "filesystem table" },
                    { q: "What command shows free disk space?", a: ["df", "df -h"], hint: "disk free" },
                    { q: "What ACL command grants read to a user?", a: ["setfacl -m u:user:r"], hint: "setfacl" },
                    { q: "What command displays ACL info?", a: ["getfacl"], hint: "getfacl" },
                    { q: "What directory contains home directories?", a: ["/home", "/root"], hint: "home" },
                    { q: "What sticky bit prevents deleting others' files?", a: ["chmod +t"], hint: "t bit" },
                    { q: "What command creates an ext4 filesystem?", a: ["mkfs.ext4", "mkfs -t ext4"], hint: "make fs ext4" },
                    { q: "What is the virtual filesystem in RAM?", a: ["tmpfs"], hint: "temp filesystem" },
                    { q: "What command resizes an ext filesystem?", a: ["resize2fs"], hint: "resize ext" },
                    { q: "What option in /etc/fstab makes it readonly?", a: ["ro"], hint: "read only" },
                    { q: "What command lists open files for a process?", a: ["lsof"], hint: "list open files" },
                    { q: "What UUID type identifies filesystems?", a: ["UUID="], hint: "Universal Unique ID" },
                    { q: "What directory contains temporary files?", a: ["/tmp"], hint: "temporary" },
                    { q: "What is the default ACL permission for files?", a: ["rw-r--r--"], hint: "read write" }
                ]
            },
            networking: {
                title: "Networking",
                desc: "Network configuration, DNS, firewall, and services",
                questions: [
                    { q: "What is the default SSH port?", a: ["22"], hint: "Number" },
                    { q: "What file defines DNS nameservers?", a: ["/etc/resolv.conf"], hint: "resolver config" },
                    { q: "What command shows network interfaces?", a: ["ip addr", "ip link", "ifconfig"], hint: "ip or ifconfig" },
                    { q: "What service manages firewalld?", a: ["firewalld"], hint: "firewall daemon" },
                    { q: "What command adds a firewall rule?", a: ["firewall-cmd"], hint: "firewall cmd" },
                    { q: "What file contains the hostname?", a: ["/etc/hostname"], hint: "hostname file" },
                    { q: "What is the loopback interface IP?", a: ["127.0.0.1"], hint: "localhost" },
                    { q: "What command shows routing table?", a: ["ip route", "route"], hint: "ip route" },
                    { q: "What daemon provides DHCP?", a: ["dhcpd", "dhcp"], hint: "Dynamic Host Config" },
                    { q: "What command tests DNS resolution?", a: ["nslookup", "dig", "host"], hint: "DNS lookup" },
                    { q: "What protocol does DNS use by default?", a: ["UDP", "UDP/53"], hint: "port 53" },
                    { q: "What file maps hostnames to IPs?", a: ["/etc/hosts"], hint: "hosts file" },
                    { q: "What command brings up an interface?", a: ["ip link set up", "ifconfig up"], hint: "ip link set" },
                    { q: "What network manager service?", a: ["NetworkManager"], hint: "network manager" },
                    { q: "What command shows active connections?", a: ["ss", "netstat"], hint: "socket stats" },
                    { q: "What port does HTTP use?", a: ["80"], hint: "Number" },
                    { q: "What port does HTTPS use?", a: ["443"], hint: "Number" },
                    { q: "What command traces network path?", a: ["traceroute", "tracepath"], hint: "trace route" },
                    { q: "What file controls network sysctl params?", a: ["/etc/sysctl.conf"], hint: "sysctl config" },
                    { q: "What command reloads network config?", a: ["systemctl restart NetworkManager"], hint: "restart network" },
                    { q: "What is the broadcast address IP?", a: ["255.255.255.255"], hint: "all ones" },
                    { q: "What command tests network connectivity?", a: ["ping"], hint: "ping" },
                    { q: "What DNS service caches queries?", a: ["named", "bind"], hint: "bind daemon" },
                    { q: "What is the subnet mask for /24?", a: ["255.255.255.0"], hint: "24 bits" },
                    { q: "What command creates a bond interface?", a: ["nmcli connection add type bond"], hint: "bond" }
                ]
            },
            security: {
                title: "Security",
                desc: "User management, SELinux, sudo, and system hardening",
                questions: [
                    { q: "What command adds a user?", a: ["useradd", "adduser"], hint: "user add" },
                    { q: "What file stores user password hashes?", a: ["/etc/shadow"], hint: "shadow file" },
                    { q: "What command changes user password?", a: ["passwd"], hint: "password" },
                    { q: "What SELinux mode allows based on policy?", a: ["enforcing"], hint: "SELinux mode" },
                    { q: "What command manages SELinux context?", a: ["semanage", "chcon"], hint: "SELinux manage" },
                    { q: "What file sudoers config?", a: ["/etc/sudoers"], hint: "sudoers" },
                    { q: "What command runs as another user?", a: ["su", "sudo"], hint: "switch user" },
                    { q: "What command creates a group?", a: ["groupadd", "addgroup"], hint: "group add" },
                    { q: "What command displays user groups?", a: ["id", "groups"], hint: "identity" },
                    { q: "What SELinux boolean enables httpd scripts?", a: ["httpd_enable_cgi"], hint: "httpd enable" },
                    { q: "What command shows failed logins?", a: ["faillog", "lastb"], hint: "failed log" },
                    { q: "What directory contains SSL certificates?", a: ["/etc/ssl", "/etc/pki/tls"], hint: "SSL dir" },
                    { q: "What command locks an account?", a: ["usermod -L", "passwd -l"], hint: "lock user" },
                    { q: "What command generates SSH key?", a: ["ssh-keygen"], hint: "SSH key" },
                    { q: "What is the UID for root?", a: ["0"], hint: "Number" },
                    { q: "What port does SSH use?", a: ["22"], hint: "Number" },
                    { q: "What command lists open ports?", a: ["netstat -tulpn", "ss -tulpn"], hint: "listening ports" },
                    { q: "What command verifies SSH config?", a: ["sshd -t"], hint: "test config" },
                    { q: "What audit log location?", a: ["/var/log/audit/audit.log"], hint: "audit log" },
                    { q: "What command kills process by name?", a: ["pkill", "killall"], hint: "process kill" },

            else showCommandsMenu();
        }

            mainMenu.style.display = 'none';
            quizMenu.style.display = 'block';
            quizView.style.display = 'none';
            quizScore.style.display = 'none';
            document.getElementById('quiz-sections').innerHTML = '';
            Object.keys(quizzes).forEach((key, i) => {
                const q = quizzes[key];
                const card = document.createElement('div');
                card.className = 'card section-' + (i % 6);
                card.innerHTML = `<h3>${q.title}</h3><p>${q.desc}</p><span class="badge">${q.questions.length} Qs</span>`;
                card.onclick = () => startQuiz(key);
                document.getElementById('quiz-sections').appendChild(card);
            });
        }

            mainMenu.style.display = 'none';
            commandsMenu.style.display = 'block';
            commandsDetail.style.display = 'none';
            document.getElementById('command-sections').innerHTML = '';
            Object.keys(commandSections).forEach((key, i) => {
                const s = commandSections[key];
                const card = document.createElement('div');
                card.className = 'card section-' + (i % 6);
                card.innerHTML = `<h3>${s.title}</h3><p>${s.desc}</p><span class="badge">${s.commands.length}</span>`;

        function showCommandSection(key, index) {
            currentSection = commandSections[key];
            document.getElementById('detailTitle').textContent = currentSection.title;
            commandsMenu.style.display = 'none';
            commandsDetail.style.display = 'block';
            document.getElementById('cmdSearch').value = '';
            renderCommands(currentSection.commands);
        }

        function renderCommands(cmds) {
            document.getElementById('commandsList').innerHTML = cmds.map((c, i) => `
                <div class="cmd-card" style="animation-delay: ${i * 0.03}s">
                    <code>${c.cmd}</code>
                    <div class="desc">${c.desc}</div>
                </div>
            `).join('');
        }

        function filterCommands() {
            if (!currentSection) return;
            const query = document.getElementById('cmdSearch').value.toLowerCase();
            const filtered = !query ? currentSection.commands : currentSection.commands.filter(c => 
                c.cmd.toLowerCase().includes(query) || c.desc.toLowerCase().includes(query)
            );
            renderCommands(filtered);
        }

        document.getElementById('cmdSearch').addEventListener('input', filterCommands);

        function shuffleArray(arr) {
            let a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function startQuiz(key) {
            currentQuiz = quizzes[key];
            questionOrder = shuffleArray(currentQuiz.questions).map((_, i) => i);
            currentQ = 0;
            correct = 0;
            quizMenu.style.display = 'none';
            quizView.style.display = 'block';
            loadQuestion();
        }

        function loadQuestion() {
            const idx = questionOrder[currentQ];
            document.getElementById('progress').textContent = `Question ${currentQ + 1} of ${currentQuiz.questions.length}`;
            document.getElementById('question').textContent = currentQuiz.questions[idx].q;
            document.getElementById('hint').textContent = currentQuiz.questions[idx].hint;
            document.getElementById('answer').value = '';
            document.getElementById('result').style.display = 'none';
            document.getElementById('answer').focus();
        }

        function checkAnswer() {
            const idx = questionOrder[currentQ];
            const userAnswer = document.getElementById('answer').value.trim().toLowerCase();
            const correctAnswers = currentQuiz.questions[idx].a.map(a => a.toLowerCase());
            
            const resultEl = document.getElementById('result');
            if (correctAnswers.includes(userAnswer)) {
                resultEl.textContent = '✓ Correct!';
                resultEl.className = 'result correct';
                correct++;
            } else {
                resultEl.textContent = '✗ Incorrect. Answer: ' + currentQuiz.questions[idx].a[0];
                resultEl.className = 'result incorrect';
            }
            resultEl.style.display = 'block';
            
            setTimeout(() => {
                currentQ++;
                if (currentQ < currentQuiz.questions.length) loadQuestion();
                else showScore();
            }, 1500);
        }

        function showScore() {
            quizView.style.display = 'none';
            quizScore.style.display = 'block';
            document.getElementById('scoreContent').innerHTML = `
                <h2>Exam Complete</h2>
                <p>You scored:</p>
                <p class="final-score">${correct} / ${currentQuiz.questions.length}</p>
                <p>${correct >= 20 ? 'Excellent!' : correct >= 15 ? 'Good job!' : 'Keep studying!'}</p>
                <button class="btn" onclick="startQuiz('${Object.keys(quizzes).find(k => quizzes[k] === currentQuiz)}')" style="margin-top:20px;">Try Again</button>
            `;
        }

        document.getElementById('submit').addEventListener('click', checkAnswer);
        document.getElementById('answer').addEventListener('keypress', (e) => { if (e.key === 'Enter') checkAnswer(); });

        function updateClock() {
            document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US', { hour12: false });
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>

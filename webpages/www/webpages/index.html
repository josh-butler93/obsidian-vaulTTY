<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a0a0f;
            font-family: 'Rajdhani', sans-serif;
            color: #e0e0e0;
            overflow-x: hidden;
        }

        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 234, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 234, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.3;
            animation: float 8s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        .glow-orb.cyan {
            width: 600px;
            height: 600px;
            background: #00ffea;
            top: 10%;
            left: 5%;
            animation-delay: 0s;
            box-shadow: 0 0 300px 80px rgba(0, 255, 234, 0.3);
        }

        .glow-orb.purple {
            width: 550px;
            height: 550px;
            background: #8b5cf6;
            bottom: 10%;
            right: 5%;
            animation-delay: -4s;
            box-shadow: 0 0 300px 80px rgba(139, 92, 246, 0.3);
        }

        .glow-orb.magenta {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #ff006e 0%, #8b5cf6 100%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -2s;
            opacity: 0.25;
        }

        .glow-orb.deep-blue {
            width: 700px;
            height: 700px;
            background: #0066ff;
            top: -15%;
            right: -15%;
            animation-delay: -6s;
            opacity: 0.3;
        }

        .glow-orb.dark-portal {
            width: 900px;
            height: 900px;
            background: radial-gradient(circle, #1a0033 0%, #0a0a0f 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: portalPulse 6s ease-in-out infinite;
            opacity: 0.9;
            border: 1px solid rgba(139, 92, 246, 0.15);
        }

        .floating-orb {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }

        .floating-orb.s1 {
            width: 14px;
            height: 14px;
            background: #00ffea;
            box-shadow: 0 0 30px 8px #00ffea, 0 0 60px 20px rgba(0, 255, 234, 0.6), 0 0 100px 40px rgba(0, 255, 234, 0.3);
            top: 20%;
            left: 15%;
            animation: floatOrb1 12s ease-in-out infinite;
        }

        .floating-orb.s2 {
            width: 12px;
            height: 12px;
            background: #8b5cf6;
            box-shadow: 0 0 25px 6px #8b5cf6, 0 0 50px 15px rgba(139, 92, 246, 0.6), 0 0 80px 30px rgba(139, 92, 246, 0.3);
            top: 70%;
            right: 20%;
            animation: floatOrb2 10s ease-in-out infinite;
        }

        .floating-orb.s3 {
            width: 16px;
            height: 16px;
            background: #ff006e;
            box-shadow: 0 0 35px 10px #ff006e, 0 0 70px 25px rgba(255, 0, 110, 0.6), 0 0 100px 40px rgba(255, 0, 110, 0.3);
            bottom: 30%;
            left: 25%;
            animation: floatOrb3 14s ease-in-out infinite;
        }

        .floating-orb.s4 {
            width: 10px;
            height: 10px;
            background: #00ffea;
            box-shadow: 0 0 20px 5px #00ffea, 0 0 40px 15px rgba(0, 255, 234, 0.5);
            top: 40%;
            right: 30%;
            animation: floatOrb4 8s ease-in-out infinite;
        }

        .floating-orb.s5 {
            width: 13px;
            height: 13px;
            background: linear-gradient(135deg, #00ffea, #8b5cf6);
            box-shadow: 0 0 30px 8px rgba(0, 255, 234, 0.7), 0 0 60px 20px rgba(139, 92, 246, 0.5);
            top: 60%;
            left: 40%;
            animation: floatOrb5 11s ease-in-out infinite;
        }

        .floating-orb.s6 {
            width: 8px;
            height: 8px;
            background: #00ffea;
            box-shadow: 0 0 15px 4px #00ffea, 0 0 35px 12px rgba(0, 255, 234, 0.5);
            top: 15%;
            right: 25%;
            animation: floatOrb6 9s ease-in-out infinite;
        }

        .lightning {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            opacity: 0;
        }

        .lightning.flash {
            animation: lightningFlash 0.1s ease-out;
        }

        @keyframes lightningFlash {
            0% { opacity: 0; background: transparent; }
            10% { opacity: 1; background: radial-gradient(ellipse at 20% 30%, rgba(0, 255, 234, 0.3) 0%, transparent 50%); }
            30% { opacity: 0.5; background: radial-gradient(ellipse at 80% 60%, rgba(139, 92, 246, 0.2) 0%, transparent 40%); }
            50% { opacity: 0.8; background: radial-gradient(ellipse at 30% 70%, rgba(0, 255, 234, 0.2) 0%, transparent 45%); }
            100% { opacity: 0; background: transparent; }
        }

        .portal-ring {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid rgba(139, 92, 246, 0.1);
            pointer-events: none;
            z-index: 0;
        }

        .portal-ring.r1 { width: 500px; height: 500px; animation: ringRotate 20s linear infinite; }
        .portal-ring.r2 { width: 700px; height: 700px; animation: ringRotate 25s linear infinite reverse; border-color: rgba(0, 255, 234, 0.1); }
        .portal-ring.r3 { width: 900px; height: 900px; animation: ringRotate 30s linear infinite; border-color: rgba(139, 92, 246, 0.08); }
        .portal-ring.r4 { width: 1100px; height: 1100px; animation: ringRotate 35s linear infinite reverse; border-color: rgba(0, 255, 234, 0.05); }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 0%, transparent 40%, rgba(0, 0, 0, 0.8) 100%);
            pointer-events: none;
            z-index: 3;
        }

        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 4;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        .page-glitch {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            opacity: 0;
        }

        .page-glitch.active {
            animation: pageGlitch 0.3s ease-out;
        }

        @keyframes pageGlitch {
            0% { opacity: 0; }
            10% { opacity: 1; transform: translate(-2px, 0); }
            20% { opacity: 0.8; transform: translate(2px, 0); filter: hue-rotate(90deg); }
            30% { opacity: 1; transform: translate(-1px, 1px); filter: hue-rotate(-90deg); }
            40% { opacity: 0.6; transform: translate(1px, -1px); filter: hue-rotate(180deg); }
            50% { opacity: 0; transform: translate(0); filter: none; }
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.1); }
        }

        @keyframes portalPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            50% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
        }

        @keyframes ringRotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes floatOrb1 {
            0%, 100% { transform: translate(0, 0); opacity: 0.8; }
            25% { transform: translate(50px, -30px); opacity: 1; }
            50% { transform: translate(20px, 40px); opacity: 0.6; }
            75% { transform: translate(-30px, 20px); opacity: 0.9; }
        }

        @keyframes floatOrb2 {
            0%, 100% { transform: translate(0, 0); opacity: 0.7; }
            33% { transform: translate(-40px, -50px); opacity: 1; }
            66% { transform: translate(30px, 30px); opacity: 0.5; }
        }

        @keyframes floatOrb3 {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.9; }
            50% { transform: translate(-60px, -40px) scale(1.2); opacity: 1; }
        }

        @keyframes floatOrb4 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(40px, -20px); }
        }

        @keyframes floatOrb5 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); opacity: 0.8; }
            25% { transform: translate(30px, 30px) rotate(90deg); opacity: 1; }
            50% { transform: translate(-20px, 50px) rotate(180deg); opacity: 0.6; }
            75% { transform: translate(-40px, 10px) rotate(270deg); opacity: 0.9; }
        }

        @keyframes floatOrb6 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-20px, -30px) scale(1.5); }
        }

        .container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
            animation: pageFloat 6s ease-in-out infinite;
        }

        @keyframes pageFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .terminal-line {
            font-family: 'Rajdhani', monospace;
            font-size: 0.9rem;
            color: #00ffea;
            margin-bottom: 2rem;
            opacity: 0;
            animation: fadeIn 1s ease forwards;
            text-shadow: 0 0 10px rgba(0, 255, 234, 0.5);
        }

        .terminal-line span {
            color: #8b5cf6;
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.5rem, 8vw, 6rem);
            font-weight: 900;
            letter-spacing: 0.2em;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #00ffea 0%, #8b5cf6 50%, #00ffea 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 4s ease infinite, fadeInUp 1s ease 0.3s forwards, glitch 5s infinite;
            opacity: 0;
            position: relative;
        }

        .title::before,
        .title::after {
            content: 'WELCOME';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #00ffea 0%, #8b5cf6 50%, #00ffea 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .title::before {
            animation: glitchTop 5s infinite;
            clip-path: polygon(0 0, 100% 0, 100% 33%, 0 33%);
        }

        .title::after {
            animation: glitchBottom 5s infinite;
            clip-path: polygon(0 67%, 100% 67%, 100% 100%, 0 100%);
        }

        @keyframes glitchTop {
            0%, 94%, 100% { transform: translate(0); opacity: 0; }
            95% { transform: translate(-5px, 2px); opacity: 1; }
            96% { transform: translate(5px, -2px); opacity: 1; }
            97% { transform: translate(-3px, 1px); opacity: 1; }
        }

        @keyframes glitchBottom {
            0%, 94%, 100% { transform: translate(0); opacity: 0; }
            95% { transform: translate(5px, -2px); opacity: 1; }
            96% { transform: translate(-5px, 2px); opacity: 1; }
            97% { transform: translate(3px, -1px); opacity: 1; }
        }

        @keyframes glitch {
            0%, 92%, 94%, 100% {
                text-shadow: none;
                transform: translate(0);
            }
            93% {
                text-shadow: 
                    -3px 0 #ff006e,
                    3px 0 #00ffea,
                    0 0 30px rgba(0, 255, 234, 0.5);
                transform: translate(-2px, 1px);
            }
            93.5% {
                text-shadow: 
                    3px 0 #8b5cf6,
                    -3px 0 #00ffea,
                    0 0 30px rgba(139, 92, 246, 0.5);
                transform: translate(2px, -1px);
            }
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .subtitle {
            font-size: 1.2rem;
            color: #888;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 3rem;
            opacity: 0;
            animation: fadeInUp 1s ease 0.6s forwards;
        }

        .status-bar {
            display: flex;
            gap: 2rem;
            margin-bottom: 3rem;
            opacity: 0;
            animation: fadeInUp 1s ease 0.9s forwards;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: #666;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ffea;
            box-shadow: 0 0 10px #00ffea;
            animation: pulse 2s ease-in-out infinite;
        }

        .status-dot.purple {
            background: #8b5cf6;
            box-shadow: 0 0 10px #8b5cf6;
            animation-delay: -1s;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .cta-button {
            position: relative;
            padding: 1rem 3rem;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: #0a0a0f;
            background: linear-gradient(135deg, #00ffea, #8b5cf6);
            border: none;
            cursor: pointer;
            overflow: hidden;
            opacity: 0;
            animation: fadeInUp 1s ease 1.2s forwards;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s ease;
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 40px rgba(0, 255, 234, 0.3);
        }

        .cta-button:hover::before {
            left: 100%;
        }

        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00ffea, transparent);
            animation: scan 4s linear infinite;
            pointer-events: none;
            z-index: 100;
            opacity: 0.5;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .corner {
            position: fixed;
            width: 60px;
            height: 60px;
            border: 2px solid rgba(0, 255, 234, 0.3);
            pointer-events: none;
            z-index: 10;
        }

        .corner.top-left {
            top: 20px;
            left: 20px;
            border-right: none;
            border-bottom: none;
        }

        .corner.top-right {
            top: 20px;
            right: 20px;
            border-left: none;
            border-bottom: none;
        }

        .corner.bottom-left {
            bottom: 20px;
            left: 20px;
            border-right: none;
            border-top: none;
        }

        .corner.bottom-right {
            bottom: 20px;
            right: 20px;
            border-left: none;
            border-top: none;
        }

        .datetime {
            position: fixed;
            bottom: 30px;
            right: 100px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            color: #00ffea;
            opacity: 0.6;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="glow-orb dark-portal"></div>
    <div class="glow-orb cyan"></div>
    <div class="glow-orb purple"></div>
    <div class="glow-orb magenta"></div>
    <div class="glow-orb deep-blue"></div>
    
    <div class="portal-ring r1"></div>
    <div class="portal-ring r2"></div>
    <div class="portal-ring r3"></div>
    <div class="portal-ring r4"></div>
    
    <div class="floating-orb s1"></div>
    <div class="floating-orb s2"></div>
    <div class="floating-orb s3"></div>
    <div class="floating-orb s4"></div>
    <div class="floating-orb s5"></div>
    <div class="floating-orb s6"></div>
    
    <div class="lightning" id="lightning"></div>
    <div class="vignette"></div>
    <div class="noise"></div>
    <div class="page-glitch" id="pageGlitch"></div>
    <div class="scan-line"></div>
    
    <div class="corner top-left"></div>
    <div class="corner top-right"></div>
    <div class="corner bottom-left"></div>
    <div class="corner bottom-right"></div>

    <div class="container">
        <div class="terminal-line">root@system:~# <span>connection_established</span></div>
        
        <h1 class="title">WELCOME</h1>
        
        <p class="subtitle">System Initialized • Ready for Access</p>
        
        <div class="status-bar">
            <div class="status-item">
                <div class="status-dot"></div>
                <span>Online</span>
            </div>
            <div class="status-item">
                <div class="status-dot purple"></div>
                <span>Secure</span>
            </div>
        </div>

        <a href="#" class="cta-button">ENTER PORTAL</a>
    </div>

    <div class="datetime" id="datetime"></div>

    <script>
        function updateDateTime() {
            const now = new Date();
            const options = { 
                year: 'numeric', 
                month: 'short', 
                day: '2-digit',
                hour: '2-digit', 
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            };
            document.getElementById('datetime').textContent = 
                now.toLocaleString('en-US', options).toUpperCase();
        }
        updateDateTime();
        setInterval(updateDateTime, 1000);

        function triggerLightning() {
            const lightning = document.getElementById('lightning');
            lightning.classList.remove('flash');
            void lightning.offsetWidth;
            lightning.classList.add('flash');
        }

        function randomLightning() {
            triggerLightning();
            setTimeout(triggerLightning, 100);
            setTimeout(triggerLightning, 150);
            const nextDelay = 3000 + Math.random() * 7000;
            setTimeout(randomLightning, nextDelay);
        }
        setTimeout(randomLightning, 2000);

        function triggerPageGlitch() {
            const glitch = document.getElementById('pageGlitch');
            glitch.classList.remove('active');
            void glitch.offsetWidth;
            glitch.classList.add('active');
        }

        function randomPageGlitch() {
            triggerPageGlitch();
            const nextDelay = 6000 + Math.random() * 10000;
            setTimeout(randomPageGlitch, nextDelay);
        }
        setTimeout(randomPageGlitch, 4000);
    </script>
</body>
</html>

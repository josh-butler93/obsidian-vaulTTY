Default Ansible inventory
      +#
      +# Replace the example hostnames/IPs with your real hosts.
      +# You can connect by hostname, IP address, or DNS name.
      +#
      +# Example host entry format:
      +# hostname ansible_host=192.168.1.10 ansible_user=your_user
      +
      +[debian]
      +# Debian/Ubuntu-based hosts
      +# debian-server-01 ansible_host=192.168.1.10 ansible_user=sysadmin
      +# ubuntu-server-01 ansible_host=192.168.1.11 ansible_user=sysadmin
      +
      +[rhel]
      +# RHEL/Fedora/CentOS/Rocky/Alma-based hosts
      +# rocky-server-01 ansible_host=192.168.1.20 ansible_user=sysadmin
      +# fedora-server-01 ansible_host=192.168.1.21 ansible_user=sysadmin
      +
      +[arch]
      +# Arch/Manjaro/EndeavourOS-based hosts
      +# arch-server-01 ansible_host=192.168.1.30 ansible_user=sysadmin
      +# manjaro-server-01 ansible_host=192.168.1.31 ansible_user=sysadmin
      +
      +[linux:children]
      +debian
      +rhel
      +arch
      +
      +# Optional shared variables for all Linux hosts
      +[linux:vars]
      +ansible_python_interpreter=/usr/bin/python3
      +# ansible_become=true
      +# ansible_become_method=sudo
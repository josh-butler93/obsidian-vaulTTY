apiVersion: v1
kind: Service
metadata: 
  name: nginx-service # The name of the service --i.e. kubectl get svc -n monitoring --name will be nginx-service
spec:
  selector: # Pods service will send traffic to this selecting any pods with the label app: nginx
    app: nginx
  ports: # Specifies which port the Service should use
    - protocol: TCP
      port: 80
      targetPort: 80
  type: NodePort # This means the service will be accessible on a port on each node in the cluster

# selector: determines which Pods the service will send traffic to...in this case it will select any Pods with the label app:nginx
# ports: this specifies which ports the Service should use
# type: NodePort--means the Service will be accessible on a port on each node in     the cluster
####
# ----kubectl apply -f nginx-service.yaml
# ----kubectl describe service nginx-service
# ----kubectl get services -n <name_space> <<add name space if needed>>
# ------PORT(S)--80:84453/TCP
#                port 80 inside cluster___port 84453 on the node
# ----minikube service nginx-service --url
# ----curl $(minikube service nginx-service --url)
